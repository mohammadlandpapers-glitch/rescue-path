<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rescue Path | Driver Dashboard</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --system-blue: #007aff;
            --emergency-green: #34c759;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 95vh;
        }

        .status-header {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: #0ff;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: #0ff;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .alert-card {
            background-color: #2c0e0e;
            border: 2px solid #ff3b30;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            display: none;
            animation: shake 0.5s ease-in-out;
        }

        .alert-title {
            color: #ff3b30;
            font-size: 20px;
            font-weight: 800;
            margin: 0 0 10px 0;
            letter-spacing: 1px;
        }

        .navigation-panel {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .hospital-select {
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 8px;
            padding: 14px;
            color: var(--text-main);
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
        }

        .action-btn {
            background-color: var(--system-blue);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .action-btn:disabled {
            background-color: #3a3a3c;
            color: #777;
            cursor: not-allowed;
        }

        .action-btn.active-transit {
            background-color: var(--emergency-green);
        }

        .log-box {
            background-color: #000;
            border: 1px solid #2c2c2e;
            font-family: monospace;
            padding: 10px;
            border-radius: 8px;
            height: 120px;
            overflow-y: auto;
            font-size: 11px;
            color: #34c759;
            margin-top: 5px;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
    </style>
</head>
<body>

    <div class="status-header">
        <div>
            <div style="font-size: 10px; color: var(--text-muted)">VEHICLE ID</div>
            <div style="font-weight: bold;">AMB-TELE-108</div>
        </div>
        <div class="status-indicator" id="dutyStatus">
            <div class="pulse-dot"></div>
            <span>STANDBY</span>
        </div>
    </div>

    <div class="alert-card" id="incomingAlertCard">
        <div class="alert-title">🚨 EMERGENCY ASSIGNED</div>
        <div style="margin-bottom: 15px; font-size: 14px;">
            <p><strong>Patient ID:</strong> <span id="alertPatientId">--</span></p>
            <p><strong>GPS:</strong> <span id="alertGps">--</span></p>
        </div>
        <button class="action-btn" style="background-color: #ff3b30;" onclick="acceptWaterfallMission()">
            ACCEPT DISPATCH
        </button>
    </div>

    <div class="navigation-panel">
        <h3 style="margin: 0;">Destination Management</h3>
        <select class="hospital-select" id="hospitalSelector">
            <option value="">-- Choose Hospital --</option>
            <option value="Government General Hospital">Government General Hospital</option>
            <option value="Sri Venkateshwara Multi Speciality">Sri Venkateshwara Multi Speciality</option>
            <option value="Apollo Health City">Apollo Health City</option>
        </select>

        <button class="action-btn" id="transitControlBtn" onclick="toggleHospitalTransit()" disabled>
            START TRANSIT CLEARANCE
        </button>

        <div style="font-size: 11px; font-weight: bold; margin-top: 10px; color: var(--text-muted);">SYSTEM LOGS</div>
        <div class="log-box" id="telemetryLog">Initializing system handshake...</div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <script>
        // Server Configurations
        const socket = io('http://localhost:3000'); // Node Server
        const PYTHON_BACKEND = 'http://localhost:8000'; // Python Server
        
        let currentMission = null;
        let beaconInterval = null;

        // Log Functionality
        function logTelemetry(msg) {
            const logBox = document.getElementById('telemetryLog');
            logBox.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // 1. Initial Connection & Registration
        socket.on('connect', () => {
            logTelemetry("Connected to Node Coordination Server.");
            socket.emit('register', { role: 'driver', id: 'AMB-TELE-108' });
        });

        // 2. Listen for Dispatch alerts from Node Server
        socket.on('DISPATCH_INVITE', (packet) => {
            currentMission = packet;
            document.getElementById('alertPatientId').innerText = packet.patient_id || "9281410800";
            document.getElementById('alertGps').innerText = `${packet.lat.toFixed(4)}, ${packet.lon.toFixed(4)}`;
            document.getElementById('incomingAlertCard').style.display = 'block';
            logTelemetry("🚨 ALERT: Emergency SOS received via Socket.");
        });

        // 3. Fallback: Manual simulation for testing (triggers after 4 seconds)
        setTimeout(() => {
            if (!currentMission) {
                logTelemetry("Self-testing: Simulating incoming packet...");
                socket.emit('EMERGENCY_TRIGGER', { 
                    patient_id: "9281410800", 
                    lat: 18.8745, 
                    lon: 79.2145 
                });
            }
        }, 4000);

        // 4. Accept Mission Logic
        async function acceptWaterfallMission() {
            // UI Transition
            document.getElementById('incomingAlertCard').style.display = 'none';
            document.getElementById('dutyStatus').style.color = '#ffcc00';
            document.getElementById('dutyStatus').querySelector('.pulse-dot').style.backgroundColor = '#ffcc00';
            document.getElementById('dutyStatus').querySelector('span').innerText = "EN-ROUTE";
            document.getElementById('transitControlBtn').disabled = false;

            // Notify Node Server
            socket.emit('accept_mission', { driver_id: 'AMB-TELE-108' });

            // Notify Python Backend
            try {
                const response = await fetch(`${PYTHON_BACKEND}/sos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        patient_id: currentMission.patient_id || "9281410800",
                        lat: currentMission.lat,
                        lon: currentMission.lon
                    })
                });
                const data = await response.json();
                logTelemetry(`Python Response: ${data.status}`);
            } catch (err) {
                logTelemetry("❌ Python Backend Offline");
            }
        }

        // 5. Transit Control & Telemetry Loop
        function toggleHospitalTransit() {
            const selectedHospital = document.getElementById('hospitalSelector').value;
            const btn = document.getElementById('transitControlBtn');

            if (!selectedHospital) {
                alert("Please select a hospital.");
                return;
            }

            if (!beaconInterval) {
                btn.innerText = "HALT CORRIDOR CLEARANCE";
                btn.classList.add('active-transit');
                logTelemetry(`CODE 1 ACTIVE: Transit to ${selectedHospital}`);
                beaconInterval = setInterval(sendLiveLocationBeacon, 2000);
            } else {
                clearInterval(beaconInterval);
                beaconInterval = null;
                btn.innerText = "START TRANSIT CLEARANCE";
                btn.classList.remove('active-transit');
                logTelemetry("Clearance transmission halted.");
            }
        }

        // 6. Live Location Beacon to Python
        function sendLiveLocationBeacon() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const payload = {
                        ambulance_id: "AMB-TELE-108",
                        lat: position.coords.latitude,
                        lon: position.coords.longitude,
                        code_status: "AMBULANCE_CODE_1",
                        destination: document.getElementById('hospitalSelector').value
                    };
                    
                    try {
                        await fetch(`${PYTHON_BACKEND}/telemetry/update`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        logTelemetry(`Beacon Sent: [${payload.lat.toFixed(4)}, ${payload.lon.toFixed(4)}]`);
                    } catch (err) {
                        console.error("Telemetry link lost.");
                    }
                }, null, { enableHighAccuracy: true });
            }
        }
    </script>
</body>
</html>
