<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #000; color: #fff; text-align: center; font-family: sans-serif; }
        #hud { border: 5px solid red; padding: 50px; margin: 20px; display: none; }
        .blink { animation: blinker 0.6s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <button onclick="activateAmbulance()">AMBULANCE MODE</button>
    <div id="hud">
        <h1 id="dist">--</h1>
        <p id="instr">SCANNING...</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        function activateAmbulance() {
            navigator.geolocation.watchPosition(p => {
                socket.emit('start_journey', {lat: p.coords.latitude, lng: p.coords.longitude});
            });
        }
        socket.on('proximity_update', (dist) => {
            document.getElementById('hud').style.display = 'block';
            document.getElementById('dist').innerText = dist + "m";
            if(dist < 150) { 
                document.getElementById('instr').innerText = "MOVE LEFT NOW!";
                navigator.vibrate(500);
            }
        });
    </script>
</body>
</html>
