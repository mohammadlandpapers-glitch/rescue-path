<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RescuePath | Emergency Portal</title>
    <style>
        :root { --emergency-red: #ff3b30; --system-blue: #007aff; --warning-yellow: #ffcc00; --bg-dark: #000000; --card-bg: #1c1c1e; }
        body { background: var(--bg-dark); color: #fff; font-family: sans-serif; margin: 0; text-align: center; overflow-x: hidden; }
        .card { background: var(--card-bg); padding: 30px; border-radius: 20px; margin: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .btn { width: 100%; padding: 20px; border-radius: 15px; border: none; font-size: 18px; font-weight: bold; margin: 10px 0; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        
        /* UI Sections - Hidden by default except Setup */
        #patientUI, #driverUI, #commuterUI, #virtualHUD, #choiceUI { display: none; }

        /* Patient Styling */
        #panicSurface { width: 200px; height: 200px; background: #400; border: 10px solid var(--emergency-red); border-radius: 50%; margin: 40px auto; display: flex; align-items: center; justify-content: center; user-select: none; transition: 0.3s; }
        .holding { background: var(--emergency-red) !important; transform: scale(0.9); box-shadow: 0 0 50px var(--emergency-red); }
        .countdown { font-size: 70px; font-weight: bold; color: var(--emergency-red); }

        /* Commuter/Virtual Signal Styling */
        #virtualHUD { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; flex-direction: column; justify-content: center; align-items: center; }
        .v-red { background: var(--emergency-red); animation: blink 0.5s infinite; }
        @keyframes blink { 50% { opacity: 0.7; } }
    </style>
</head>
<body>

    <div id="setupPortal" class="card">
        <h1 style="letter-spacing: 2px;">RESCUE PATH</h1>
        <p style="color: #aaa;">Select your current status to continue</p>
        <button class="btn" style="background: var(--emergency-red); color: white;" onclick="initRole('patient')">Emergency Patient</button>
        <button class="btn" style="background: var(--system-blue); color: white;" onclick="initRole('driver')">Ambulance Driver</button>
        <button class="btn" style="background: transparent; border: 2px solid #444; color: white;" onclick="initRole('commuter')">Regular Commuter</button>
    </div>

    <div id="patientUI">
        <div class="card">
            <h3>Panic Trigger</h3>
            <div id="panicSurface" onmousedown="startHold()" onmouseup="stopHold()" ontouchstart="startHold()" ontouchend="stopHold()">
                <strong>HOLD 2s</strong>
            </div>
            <div id="timerContainer" style="display:none;">
                <div id="timerDisplay" class="countdown">5</div>
                <button class="btn" style="background:#444;" onclick="location.reload()">CANCEL</button>
            </div>
            <div id="patientStatus" style="margin-top:20px; color:var(--warning-yellow);">READY</div>
        </div>

        <div id="choiceUI" class="card">
            <h3 style="color:var(--warning-yellow)">Time Sensitive Choice</h3>
            <p>Private is faster than Government.</p>
            <div style="display:flex; gap:10px;">
                <button class="btn" style="background:#333;" onclick="sendChoice('government')">Gov (FREE)</button>
                <button class="btn" style="background:var(--system-blue);" onclick="sendChoice('private')">Pvt (FAST)</button>
            </div>
        </div>
    </div>

    <div id="driverUI">
        <div class="card">
            <h2 id="driverStatusLabel">STANDBY</h2>
            <div id="dispatchBox" style="display:none; background:orange; padding:15px; border-radius:10px;">
                <h3 style="color:black">NEW REQUEST!</h3>
                <button class="btn" style="background:green; color:white;" onclick="respondDispatch(true)">ACCEPT</button>
                <button class="btn" style="background:red; color:white;" onclick="respondDispatch(false)">DECLINE</button>
            </div>
        </div>
    </div>

    <div id="commuterUI">
        <div class="card">
            <h2>Scanning Road...</h2>
            <p>The system will alert you if an ambulance is nearby.</p>
        </div>
    </div>

    <div id="virtualHUD">
        <h1 id="vText" style="font-size:50px;">STOP</h1>
        <p>MOVE LEFT - AMBULANCE APPROACHING</p>
        <button class="btn" style="width:200px; background:white; color:black;" onclick="hideVirtual()">OK</button>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        const socket = io();
        let currentRole = '';
        let holdTimer, countdownInterval;
        let dispatchCallback = null;

        function initRole(role) {
            currentRole = role;
            console.log("Switching to role: " + role);

            // Hide Menu, Show Role UI
            document.getElementById('setupPortal').style.display = 'none';
            document.getElementById(role + 'UI').style.display = 'block';

            // Start GPS Telemetry
            navigator.geolocation.watchPosition(pos => {
                const data = { role, lat: pos.coords.latitude, lng: pos.coords.longitude };
                socket.emit('register', data);
                socket.emit('telemetry', data);
            }, null, { enableHighAccuracy: true });
        }

        // --- PATIENT LOGIC ---
        function startHold() {
            document.getElementById('panicSurface').classList.add('holding');
            holdTimer = setTimeout(() => {
                document.getElementById('panicSurface').style.display = 'none';
                document.getElementById('timerContainer').style.display = 'block';
                startCountdown();
            }, 2000);
        }
        function stopHold() {
            document.getElementById('panicSurface').classList.remove('holding');
            clearTimeout(holdTimer);
        }
        function startCountdown() {
            let count = 5;
            announce("Auto dispatch in 5 seconds");
            countdownInterval = setInterval(() => {
                count--;
                document.getElementById('timerDisplay').innerText = count;
                if(count <= 0) {
                    clearInterval(countdownInterval);
                    triggerPanic();
                }
            }, 1000);
        }
        function triggerPanic() {
            navigator.geolocation.getCurrentPosition(p => {
                socket.emit('EMERGENCY_TRIGGER', { lat: p.coords.latitude, lng: p.coords.longitude });
            });
        }

        // --- SMART CHOICE ---
        socket.on('SMART_CHOICE_PROMPT', data => {
            document.getElementById('choiceUI').style.display = 'block';
            announce("A private ambulance is much closer. Please choose.");
        });
        function sendChoice(type) {
            document.getElementById('choiceUI').style.display = 'none';
            socket.emit('RESOLVE_CHOICE', type);
        }

        // --- DRIVER LOGIC ---
        socket.on('DISPATCH_INVITE', (data, callback) => {
            dispatchCallback = callback;
            document.getElementById('dispatchBox').style.display = 'block';
            announce("New mission received.");
        });
        function respondDispatch(accepted) {
            if(dispatchCallback) {
                dispatchCallback({ accepted });
                document.getElementById('dispatchBox').style.display = 'none';
                if(accepted) {
                    document.getElementById('driverStatusLabel').innerText = "MISSION ACTIVE";
                    document.getElementById('driverStatusLabel').style.color = "red";
                }
            }
        }

        // --- COMMUTER OVERRIDE ---
        socket.on('VIRTUAL_SIGNAL', data => {
            const vHUD = document.getElementById('virtualHUD');
            vHUD.style.display = 'flex';
            vHUD.className = data.type === 'RED' ? 'v-red' : '';
            document.getElementById('vText').innerText = data.type === 'RED' ? "STOP" : "CAUTION";
            announce(data.msg);
        });
        function hideVirtual() { document.getElementById('virtualHUD').style.display = 'none'; }

        // --- TTS & UPDATES ---
        socket.on('COMFORT_MSG', msg => {
            document.getElementById('patientStatus').innerText = msg;
            announce(msg);
        });
        function announce(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
